services:
  - type: web
    name: tdx-hot-rank
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_server_v2:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: PORT
        value: "10000"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
