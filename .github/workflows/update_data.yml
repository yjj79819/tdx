name: 更新热度排名数据

on:
  schedule:
    # === 开盘时段：每小时更新排名和板块 ===
    # 9:00-15:00（UTC 1:00-7:00）
    - cron: '0 1-7 * * 1-5'

    # === 收盘后：停止更新（股价和涨幅不变） ===
    # 15:00之后不再更新，直到次日开盘

  push:
    branches:
      - main
    paths:
      - 'export_data.py'
      - 'docs/index.html'
      - 'docs/data/**'
      - '.github/workflows/update_data.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests levistock

      - name: 运行数据导出脚本
        env:
          THS_COOKIE: ${{ secrets.THS_COOKIE }}
        run: python export_data.py

      - name: 检查数据变化
        id: check
        run: |
          git add -A docs/data/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交并推送
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore(data): 更新热度排名数据 $(date +'%Y-%m-%d %H:%M')"
          # 定时触发的 checkout 拿到的是「入队那一刻」的 SHA（GitHub 定时任务常延迟 10-50min），
          # 本作业跑完时远端已被 update_prices 推送过；直接 rebase 会在同一文件 content conflict。
          # 注意：rebase 语义下 -X theirs 的 theirs = 本次提交，ours = 上游新 tip（与 merge 相反），
          #       写成 ours 会把刚生成的数据退回旧值。
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed (attempt $i)"
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"
          exit 1

      - name: 部署 Pages
        uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - uses: actions/deploy-pages@v4
