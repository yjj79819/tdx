name: 快速更新股价

on:
  schedule:
    # === 开盘时段：每5分钟（最快） ===
    # 上午盘 9:30-11:30（UTC 1:30-3:30）
    - cron: '*/5 1-3 * * 1-5'
    # 下午盘 13:00-15:00（UTC 5:00-7:00）
    - cron: '*/5 5-7 * * 1-5'
    
    # === 开盘前：每10分钟 ===
    # 9:00-9:30（UTC 1:00-1:30）
    - cron: '0,10,20 1 * * 1-5'
    
    # === 收盘后：每1小时 ===
    # 15:00-18:00（UTC 7:00-10:00）
    - cron: '0 7-10 * * 1-5'
    
    # === 非交易时段：每2小时 ===
    # 18:00-次日8:00（UTC 10:00-0:00）
    - cron: '0 10-23 * * 1-5'
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行股价更新脚本
        run: python update_prices.py

      - name: 检查数据变化
        id: check
        run: |
          git add -A docs/data/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交并推送
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore(price): 更新股价 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 部署 Pages
        uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - uses: actions/deploy-pages@v4
